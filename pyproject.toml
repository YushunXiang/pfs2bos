[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pfs2bos"
version = "0.1.0"
description = "Verified, resumable rclone offloading with path-preserving symlinks"
requires-python = ">=3.10"
dependencies = ["python-dotenv>=1.0"]

[project.scripts]
pfs2bos = "pfs2bos.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
